<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#244d3e" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = null;
        try { preference = localStorage.getItem('lwanga-theme-v1'); } catch {}
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111b17' : '#f8f8f3');
      })();
    </script>
    <meta name="description" content="Your bridge between English and Kiswahili, online or offline. A language learning project by St. Charles Lwanga S.S." />
