<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#244d3e" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = null;
        try { preference = localStorage.getItem('lwanga-theme-v1'); } catch {}
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111b17' : '#f8f8f3');
      })();
    </script>
    <meta name="description" content="Lwanga Translate helps you translate between English and Kiswahili, hear Kiswahili pronunciation, and learn useful words and phrases. Free online language-learning tool." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://lwangatranslator2026.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lwanga Translate" />
    <meta property="og:title" content="Lwanga Translate — English to Kiswahili Translator" />
    <meta property="og:description" content="Translate and learn English and Kiswahili with Lwanga Translate, a free language-learning tool." />
    <meta property="og:url" content="https://lwangatranslator2026.netlify.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Lwanga Translate — English to Kiswahili Translator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
